<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="theme-color" content="#0A0A0A">
    <title>Dashboard – Akhi Bot</title>
    <style>
        /* ========== MODERN RESET ========== */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #5865F2;
            --primary-dark: #4752C4;
            --secondary: #1DB954;
            --warning: #FEE75C;
            --danger: #ED4245;
            --dark: #0A0A0A;
            --darker: #050505;
            --light: #EDEDED;
            --white: #FFFFFF;
            --gray: #888888;
            --gray-light: #AAAAAA;
            --gray-dim: #666666;
            --card-bg: #0F0F0F;
            --border: rgba(255, 255, 255, 0.05);
            --border-hover: rgba(255, 255, 255, 0.15);
            --gradient-logo: linear-gradient(110deg, #FFFFFF, #A0A0FF);
            --gradient-page: linear-gradient(135deg, #5865F2 0%, #1DB954 100%);
        }

        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--dark);
            color: var(--light);
            line-height: 1.5;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--darker); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 4px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ========== NAVIGATION ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1.2rem 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 10, 10, 0.98);
            z-index: 1000;
            border-bottom: 1px solid var(--border);
            gap: 1rem;
        }

        @supports ((-webkit-backdrop-filter: blur(12px)) or (backdrop-filter: blur(12px))) {
            .navbar {
                background: rgba(10, 10, 10, 0.85);
                -webkit-backdrop-filter: blur(12px);
                backdrop-filter: blur(12px);
            }
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--gradient-logo);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            color: #A0A0FF;
            flex-shrink: 0;
        }

        @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
            .logo { color: #A0A0FF; -webkit-text-fill-color: #A0A0FF; }
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #CCCCCC;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .nav-links a:hover { color: var(--white); }

        .auth-container { display: flex; align-items: center; }

        .auth-btn {
            background: #5865F2;
            color: #fff;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .auth-btn:hover { background: #4752C4; transform: translateY(-2px); }

        .user-menu { position: relative; }

        .user-menu-trigger {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.35rem 0.9rem 0.35rem 0.35rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            color: #fff;
            -webkit-appearance: none;
            appearance: none;
        }

        .user-menu-trigger:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: block;
            object-fit: cover;
            background: #1E1F22;
            flex-shrink: 0;
        }

        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-menu-dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);
            right: 0;
            background: #0F0F0F;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 0.4rem;
            min-width: 220px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            display: none;
            z-index: 1100;
        }

        .user-menu-dropdown.active { display: block; }

        .user-menu-header {
            padding: 0.8rem 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 0.4rem;
        }

        .user-menu-header-name {
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .user-menu-header-id {
            color: #666;
            font-size: 0.75rem;
            font-family: 'Fira Code', monospace;
            margin-top: 0.15rem;
        }

        .user-menu-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.7rem 1rem;
            color: #CCCCCC;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        .user-menu-item:hover {
            background: rgba(88, 101, 242, 0.15);
            color: #fff;
        }

        .user-menu-item.danger:hover {
            background: rgba(237, 66, 69, 0.15);
            color: #ED4245;
        }

        /* ========== DASHBOARD ========== */
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 5% 5rem;
        }

        .dash-header {
            margin-bottom: 3rem;
            animation: fadeUp 0.5s ease;
        }

        .dash-welcome {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .dash-avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #1E1F22;
            flex-shrink: 0;
            border: 3px solid rgba(88, 101, 242, 0.3);
        }

        .dash-welcome-text h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 0.3rem;
        }

        .dash-welcome-text p {
            color: var(--gray);
            font-size: 0.95rem;
        }

        /* Stats-Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
            animation: fadeUp 0.6s ease;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.25s ease;
        }

        .stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
        }

        .stat-label {
            color: var(--gray-dim);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--white);
            line-height: 1;
        }

        .stat-value.primary { color: var(--primary); }
        .stat-value.good { color: var(--secondary); }

        /* Section */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
            animation: fadeUp 0.7s ease;
        }

        .section-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .section-header h2 span {
            color: var(--gray-dim);
            font-weight: 500;
            font-size: 1rem;
            margin-left: 0.5rem;
        }

        .search-guilds {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 0.6rem 1.2rem;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            width: 240px;
            max-width: 100%;
            transition: all 0.3s;
        }

        .search-guilds:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.2);
        }

        .search-guilds::placeholder { color: #666; }

        /* Guild Grid */
        .guilds-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            animation: fadeUp 0.8s ease;
        }

        .guild-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem;
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .guild-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .guild-card.has-bot {
            border-color: rgba(29, 185, 84, 0.3);
        }

        .guild-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .guild-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1E1F22;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            color: #fff;
            overflow: hidden;
        }

        .guild-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .guild-info {
            flex: 1;
            min-width: 0;
        }

        .guild-name {
            font-weight: 600;
            font-size: 1rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.15rem;
        }

        .guild-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .guild-badge.owner {
            background: rgba(254, 231, 92, 0.15);
            color: var(--warning);
        }

        .guild-badge.admin {
            background: rgba(88, 101, 242, 0.15);
            color: var(--primary);
        }

        .guild-status {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .guild-status.has-bot { color: var(--secondary); }
        .guild-status.no-bot { color: var(--gray-dim); }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--secondary);
            flex-shrink: 0;
        }

        .status-indicator.off {
            background: #444;
        }

        .guild-actions {
            display: flex;
            gap: 0.5rem;
        }

        .guild-btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            -webkit-appearance: none;
            appearance: none;
        }

        .guild-btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .guild-btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .guild-btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #CCCCCC;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .guild-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .guild-btn-manage {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
        }

        .guild-btn-manage:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4);
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(88, 101, 242, 0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            margin: 0 auto 1.5rem;
            animation: spin 1s linear infinite;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: var(--white);
        }

        .empty-state p {
            color: var(--gray);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* Not Logged In */
        .not-logged-in {
            text-align: center;
            padding: 6rem 2rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .not-logged-in .icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
        }

        .not-logged-in h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .not-logged-in p {
            color: var(--gray);
            margin-bottom: 2rem;
        }

        .big-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            background: var(--primary);
            color: #fff;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 1rem;
        }

        .big-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* ========== FOOTER ========== */
        .footer {
            padding: 2.5rem 6%;
            background: var(--darker);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            margin-top: 4rem;
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: #777777;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s ease;
        }

        .footer-links a:hover { color: var(--white); }

        .footer-copyright { color: #555555; font-size: 0.8rem; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem 5%;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
            .auth-container {
                width: 100%;
                justify-content: center;
            }
            .dashboard { padding: 10rem 5% 3rem; }
            .dash-welcome {
                justify-content: center;
                text-align: center;
            }
            .dash-welcome-text h1 { font-size: 1.5rem; }
            .section-header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-guilds { width: 100%; }
            .guilds-grid { grid-template-columns: 1fr; }
            .footer-content { flex-direction: column; text-align: center; }
            .footer-links { justify-content: center; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">akhi bot</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="commands.html">Commands</a>
            <a href="https://discord.com/oauth2/authorize?client_id=1488199377510989894&permissions=8&scope=bot" class="nav-btn">Add to Discord</a>
        </div>
        <div class="auth-container" id="authContainer"></div>
    </nav>

    <main class="dashboard" id="dashboard">
        <div class="loading">
            <div class="spinner"></div>
            <p>Loading dashboard…</p>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <a href="index.html" class="logo" style="font-size: 1.2rem;">akhi bot</a>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="commands.html">Commands</a>
                <a href="privacy.html">Privacy</a>
                <a href="terms.html">Terms</a>
            </div>
            <div class="footer-copyright">© 2026 Akhi Bot. All rights reserved.</div>
        </div>
    </footer>

    <script>
    (function () {
        'use strict';

        var authContainer = document.getElementById('authContainer');
        var dashboardEl = document.getElementById('dashboard');
        var currentUser = null;

        function escapeHtml(str) {
            if (typeof str !== 'string') return '';
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderLoginButton() {
            authContainer.innerHTML =
                '<a href="/api/auth/login?returnTo=/dashboard.html" class="auth-btn">🎮 Login</a>';
        }

        function renderUserMenu(user) {
            var displayName = escapeHtml(user.displayName || user.username || 'User');
            var avatar = escapeHtml(user.avatar || '');

            authContainer.innerHTML =
                '<div class="user-menu">' +
                    '<button class="user-menu-trigger" type="button" id="userMenuTrigger">' +
                        '<img class="user-avatar" src="' + avatar + '" alt="" onerror="this.style.display=\'none\'">' +
                        '<span class="user-name">' + displayName + '</span>' +
                    '</button>' +
                    '<div class="user-menu-dropdown" id="userMenuDropdown">' +
                        '<div class="user-menu-header">' +
                            '<div class="user-menu-header-name">' + displayName + '</div>' +
                            '<div class="user-menu-header-id">@' + escapeHtml(user.username) + '</div>' +
                        '</div>' +
                        '<a href="dashboard.html" class="user-menu-item"><span>📊</span> Dashboard</a>' +
                        '<a href="index.html" class="user-menu-item"><span>🏠</span> Home</a>' +
                        '<button type="button" class="user-menu-item danger" id="logoutBtn"><span>🚪</span> Logout</button>' +
                    '</div>' +
                '</div>';

            var trigger = document.getElementById('userMenuTrigger');
            var dropdown = document.getElementById('userMenuDropdown');
            var logoutBtn = document.getElementById('logoutBtn');

            if (trigger && dropdown) {
                trigger.addEventListener('click', function (e) {
                    e.stopPropagation();
                    dropdown.classList.toggle('active');
                });
                document.addEventListener('click', function () {
                    dropdown.classList.remove('active');
                });
                dropdown.addEventListener('click', function (e) {
                    e.stopPropagation();
                });
            }

            if (logoutBtn) {
                logoutBtn.addEventListener('click', function () {
                    fetch('/api/auth/logout', { method: 'POST' })
                        .then(function () {
                            window.location.href = '/';
                        })
                        .catch(function () {
                            window.location.href = '/api/auth/logout';
                        });
                });
            }
        }

        function renderNotLoggedIn() {
            dashboardEl.innerHTML =
                '<div class="not-logged-in">' +
                    '<div class="icon">🔒</div>' +
                    '<h1>Login Required</h1>' +
                    '<p>You need to be logged in with Discord to access the dashboard.</p>' +
                    '<a href="/api/auth/login?returnTo=/dashboard.html" class="big-btn">🎮 Login with Discord</a>' +
                '</div>';
        }

        function renderError(message) {
            dashboardEl.innerHTML =
                '<div class="not-logged-in">' +
                    '<div class="icon">⚠️</div>' +
                    '<h1>Something went wrong</h1>' +
                    '<p>' + escapeHtml(message || 'Please try again later.') + '</p>' +
                    '<a href="/api/auth/login?returnTo=/dashboard.html" class="big-btn">🔄 Try again</a>' +
                '</div>';
        }

        function renderDashboard(user, guildsData) {
            var initial = (user.displayName || user.username || 'U').charAt(0).toUpperCase();

            var guildsHtml = '';
            if (guildsData.guilds.length === 0) {
               UpperCase guildsHtml =
                   ()) '<div class=" +empty-state">' +
                        '<div '\ class="empty-icon">🎮</div>'' +
                        '<h3>No servers found</h3>' +
                        '<p>You need to be an Admin or Owner of a Discord server to manage Akhi Bot.</p>' +
                    '</div>';
            } else {
                guildsHtml = '<div class="guilds-grid" id="guildsGrid">';
                guildsData.guilds.forEach(function (g) {
                    var badge = g.owner
                        ? '<span class="guild-badge owner">👑 Owner</span>'
                        : '<span class="guild-badge admin">🛡️ Admin</span>';

                    var status = g.hasBot
                        ? '<div class="guild-status has-bot"><span class="status-indicator"></span>Bot active</div>'
                        : '<div class="guild-status no-bot"><span class="status-indicator off"></span>Bot not added</div>';

                    var iconContent = g.icon
                        ? '<img src="' + escapeHtml(g.icon) + '" alt="" onerror="this.parentNode.textContent=\'' + escapeHtml(g.name.charAt(0).to">'
                        : escapeHtml(g.name.charAt(0).toUpperCase());

                    var actions = g.hasBot
                        ? '<a href="#" class="guild-btn guild-btn-manage" data-guild="' + escapeHtml(g.id) + '">⚙️ Manage</a>'
                        : '<a href="' + escapeHtml(guildsData.botInviteUrl + '&guild_id=' + g.id + '&disable_guild_select=true') + '" target="_blank" rel="noopener noreferrer" class="guild-btn guild-btn-primary">➕ Add Bot</a>';

                    guildsHtml +=
                        '<div class="guild-card ' + (g.hasBot ? 'has-bot' : '') + '" data-name="' + escapeHtml(g.name.toLowerCase()) + '">' +
                            '<div class="guild-header">' +
                                '<div class="guild-icon">' + iconContent + '</div>' +
                                '<div class="guild-info">' +
                                    '<div class="guild-name">' + escapeHtml(g.name) + '</div>' +
                                    badge +
                                '</div>' +
                            '</div>' +
                            status +
                            '<div class="guild-actions">' + actions + '</div>' +
                        '</div>';
                });
                guildsHtml += '</div>';
            }

            dashboardEl.innerHTML =
                '<div class="dash-header">' +
                    '<div class="dash-welcome">' +
                        '<img class="dash-avatar" src="' + escapeHtml(user.avatar) + '" alt="">' +
                        '<div class="dash-welcome-text">' +
                            '<h1>Welcome, ' + escapeHtml(user.displayName || user.username) + ' 👋</h1>' +
                            '<p>Manage your servers and Akhi Bot from one place</p>' +
                        '</div>' +
                    '</div>' +
                '</div>' +

                '<div class="stats-row">' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Total Servers</div>' +
                        '<div class="stat-value primary">' + guildsData.total + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">With Akhi Bot</div>' +
                        '<div class="stat-value good">' + guildsData.withBot + '</div>' +
                    '</div>' +
                    '<div class="stat-card">' +
                        '<div class="stat-label">Without Bot</div>' +
                        '<div class="stat-value">' + (guildsData.total - guildsData.withBot) + '</div>' +
                    '</div>' +
                '</div>' +

                '<div class="section-header">' +
                    '<h2>Your Servers <span>(' + guildsData.total + ')</span></h2>' +
                    '<input type="text" class="search-guilds" id="searchGuilds" placeholder="🔍 Search servers..." autocomplete="off">' +
                '</div>' +

                guildsHtml;

            var searchInput = document.getElementById('searchGuilds');
            if (searchInput) {
                searchInput.addEventListener('input', function () {
                    var q = searchInput.value.toLowerCase().trim();
                    var cards = document.querySelectorAll('.guild-card');
                    cards.forEach(function (card) {
                        var name = card.getAttribute('data-name') || '';
                        if (!q || name.indexOf(q) !== -1) {
                            card.style.display = '';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                });
            }

            // Manage-Buttons
            document.querySelectorAll('.guild-btn-manage').forEach(function (btn) {
                btn.addEventListener('click', function (e) {
                    e.preventDefault();
                    var guildId = btn.getAttribute('data-guild');
                    alert('Bot-Settings für Server ' + guildId + '\n\nDieses Feature kommt bald! 🚀');
                });
            });
        }

        function loadDashboard() {
            // 1. User-Info prüfen
            fetch('/api/auth/me', { credentials: 'same-origin' })
                .then(function (r) { return r.json(); })
                .then(function (meData) {
                    if (!meData || !meData.loggedIn) {
                        renderLoginButton();
                        renderNotLoggedIn();
                        return;
                    }

                    currentUser = meData.user;
                    renderUserMenu(currentUser);

                    // 2. Guilds laden
                    fetch('/api/auth/guilds', { credentials: 'same-origin' })
                        .then(function (r) {
                            if (r.status === 401) {
                                return r.json().then(function (d) {
                                    if (d.relogin) {
                                        window.location.href = '/api/auth/login?returnTo=/dashboard.html';
                                    }
                                    throw new Error(d.error || 'Session expired');
                                });
                            }
                            return r.json();
                        })
                        .then(function (guildsData) {
                            if (guildsData.error) {
                                renderError(guildsData.error);
                                return;
                            }
                            renderDashboard(currentUser, guildsData);
                        })
                        .catch(function (err) {
                            renderError(err.message);
                        });
                })
                .catch(function () {
                    renderLoginButton();
                    renderNotLoggedIn();
                });
        }

        loadDashboard();
    })();
    </script>

</body>
</html>
